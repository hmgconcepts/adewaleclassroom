<body>
<header class="public-nav" style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px">
  <a href="index.html" class="app-brand" style="border:0;padding:0"><img data-logo src="assets/img/logo.png" width="36" alt=""><strong data-practice-name>ADEWALE CLASSROOM</strong></a>
  <nav><a href="about.html">About</a> · <a href="apply.html">Apply</a> · <a href="install.html">Install</a></nav>
</header>
<main class="container" style="max-width:520px;padding:40px 16px">
  <div style="text-align:center;margin-bottom:26px">
    <img data-logo src="assets/img/logo.png" width="72" height="72" alt="" style="border-radius:20px;box-shadow:0 12px 32px rgba(5,6,174,.25);margin-bottom:14px;background:#fff;border:1px solid #e2e8f0;padding:8px">
    <h1 class="serif" style="margin:8px 0 4px;font-size:1.7rem">Welcome back</h1>
    <p class="muted" data-practice-motto style="margin:0"></p>
  </div>
  <div id="login-notice" style="display:none;margin:0 0 16px;padding:12px 14px;border-radius:12px;font-size:.9rem;line-height:1.5"></div>
  <div style="display:flex;gap:8px;margin:0 0 16px;background:#f1f5f9;padding:5px;border-radius:14px" role="tablist">
    <button class="btn btn-primary" style="flex:1;border-radius:11px" type="button" data-auth-tab="signin">Sign in</button>
    <button class="btn btn-ghost" style="flex:1;border-radius:11px" type="button" data-auth-tab="signup">Request access</button>
  </div>
  <form id="form-signin" class="card" data-auth-panel="in">
    <div class="form-group"><label>Email, name or student ID (TC-0001)</label><input class="form-input" name="email" required autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input class="form-input" type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
    <p class="help"><a href="forgot-password.html">Forgot password?</a></p>
  </form>
  <form id="form-signup" class="card" data-auth-panel="up" hidden>
    <div class="form-group"><label>Full name</label><input class="form-input" name="full_name" required></div>
    <div class="form-group"><label>Email</label><input class="form-input" type="email" name="email" required></div>
    <div class="form-group"><label>Phone</label><input class="form-input" name="phone"></div>
    <div class="form-group"><label>I am a</label>
      <select class="form-select" name="role">
        <option value="parent">Parent</option>
        <option value="student">Learner</option>
        <option value="tutor">Tutor</option>
        <option value="admin">Studio admin</option>
      </select>
    </div>
    <div class="form-group"><label>Password (min 8)</label><input class="form-input" type="password" name="password" minlength="8" required></div>
    <button class="btn btn-primary" style="width:100%" type="submit">Request access</button>
    <p class="help">An admin approves you before sign-in works. That keeps family data closed.</p>
  </form>
  <p style="text-align:center;font-size:.82rem;color:#64748b;margin-top:18px">One account, four doors: parent · learner · tutor · admin.</p>
</main>
<script>
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var reason=p.get('reason');
    var box=document.getElementById('login-notice');
    if(!box) return;
    if(reason==='noconfig'){
      box.style.display='block';
      box.style.background='#fef3c7';box.style.border='1px solid #f59e0b';box.style.color='#92400e';
      box.innerHTML='<b>Database not yet connected.</b> Sign in is unavailable until the studio owner pastes the Supabase URL and anon key into <code>assets/js/config.js</code>. See <b>DEPLOYMENT-GUIDE.md</b>. If you are the owner, complete that step then refresh.';
    } else if(reason==='pending'){
      box.style.display='block';
      box.style.background='#dbeafe';box.style.border='1px solid #3b82f6';box.style.color='#1e3a8a';
      box.textContent='Your account is awaiting admin approval. You will be able to sign in once approved.';
    }
  }catch(e){}
})();
</script>
