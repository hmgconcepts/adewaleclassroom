# ============================================================================
# Keep Supabase Alive — Tutoring Connect V9
# ----------------------------------------------------------------------------
# Supabase pauses a FREE project after 7 consecutive days without real DATABASE
# activity. This workflow performs a genuine write via the tc_keep_alive() RPC.
#
# WHY THE SCHEDULE IS EVERY 2 DAYS (not weekly, not twice-weekly)
# GitHub explicitly does NOT guarantee scheduled workflows run on time: runs can
# be delayed by hours and, during peak load, skipped entirely. A weekly ping has
# zero margin — one skipped run and the project pauses. Firing every 2 days means
# THREE consecutive runs must fail before the 7-day window closes.
#
# ONE-TIME SETUP (2 minutes):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL        https://xxxxxxxx.supabase.co
#     SUPABASE_ANON_KEY   the anon/public key (NEVER service_role)
#
# LAYERS THIS WORKFLOW PROVIDES
#   1. Retrying heartbeat write (3 attempts, exponential backoff)
#   2. Watchdog: verifies the database really recorded the write
#   3. Staleness check: fails loudly if the project is drifting toward a pause
#   4. Self-commit: GitHub disables scheduled workflows in repos with no commits
#      for 60 days. This resets that clock automatically.
#   5. Auto-raised GitHub issue on failure, so you are told rather than
#      discovering it when the project is already paused.
# ============================================================================
name: Keep Supabase Alive

on:
  schedule:
    # 06:17 UTC every 2 days. Off-the-hour minute avoids GitHub's busiest
    # scheduling moments, which is when runs are most likely to be dropped.
    - cron: '17 6 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: write   # required only by the self-commit step (Layer 4)
  issues: write     # required only by the failure-alert step (Layer 5)

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Heartbeat write to Supabase (with retries)
        id: ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          ok=0
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3…"
            code=$(curl -s -o /tmp/ping.json -w '%{http_code}' \
              -X POST "${SUPABASE_URL}/rest/v1/rpc/tc_keep_alive" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              --max-time 30 \
              -d '{"src":"github-actions"}') || code=000
            echo "HTTP $code — $(head -c 200 /tmp/ping.json)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep $((attempt * 10))
          done

          if [ "$ok" != "1" ]; then
            echo "::error::Heartbeat write FAILED after 3 attempts."
            echo "A paused project is un-paused by hand at https://supabase.com/dashboard"
            exit 1
          fi
          echo "heartbeat_ok=true" >> "$GITHUB_OUTPUT"
          echo "✅ Heartbeat written."

      - name: Verify the database recorded it, and check staleness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          code=$(curl -s -o /tmp/status.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/tc_keep_alive_status" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 30 -d '{}') || code=000

          if [ "$code" != "200" ]; then
            echo "::warning::Status RPC unavailable (HTTP $code). The write above still succeeded."
            echo "Run database/v9-keepalive-and-drive.sql to enable status reporting."
            exit 0
          fi

          cat /tmp/status.json
          state=$(grep -o '"state"[ ]*:[ ]*"[a-z]*"' /tmp/status.json | head -1 | sed 's/.*"\([a-z]*\)"$/\1/')
          days=$(grep -o '"days_since"[ ]*:[ ]*[0-9.]*' /tmp/status.json | head -1 | sed 's/.*: *//')
          echo "State: ${state:-unknown} · days since last ping: ${days:-?}"

          if [ "${state:-}" = "critical" ]; then
            echo "::error::Heartbeat is CRITICAL — the project is close to being paused."
            exit 1
          fi
          if [ "${state:-}" = "warning" ]; then
            echo "::warning::Heartbeat is stale. A scheduled run was probably skipped."
          fi
          echo "✅ Verified."

      - name: Check out repository (for the self-commit step)
        uses: actions/checkout@v4

      - name: Self-commit to reset the 60-day scheduler clock (only when needed)
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."
          if [ "$age_days" -lt 30 ]; then
            echo "Under 30 days — no self-commit needed."
            exit 0
          fi
          mkdir -p .github
          date -u +"Last automated keep-alive: %Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: keep-alive timestamp (resets GitHub's 60-day scheduler clock)"
          git push
          echo "✅ Self-commit pushed."

      - name: Raise an issue if the heartbeat failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Supabase keep-alive FAILED';
            const body = [
              'The scheduled keep-alive run did not succeed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '**Why this matters**',
              'Supabase pauses a free project after 7 days without database activity,',
              'and a project left paused is eventually deleted (~90 days).',
              '',
              '**What to check, in order**',
              '1. Are the `SUPABASE_URL` and `SUPABASE_ANON_KEY` secrets still set and correct?',
              '2. Is the project already paused? https://supabase.com/dashboard (click Restore)',
              '3. Does `database/complete-schema.sql` need re-running (missing `tc_keep_alive`)?',
              '4. Is your external scheduler (cron-job.org / UptimeRobot) still enabled?',
              '',
              'See `docs/KEEP-ALIVE-GUIDE.md` for the full runbook.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'keep-alive'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['keep-alive']
              });
            }
