<script>
document.addEventListener('DOMContentLoaded', () => {
  if (window.CRUD) {
    CRUD.init({
      el: document.getElementById('crud-root'),
      table: 'inventory',
      title: 'Inventory & Assets',
      schema: [
        { name: 'item_name', label: 'Item Name', type: 'text', required: true },
        { name: 'category', label: 'Category', type: 'text', required: true },
        { name: 'quantity', label: 'Quantity', type: 'text', required: true },
        { name: 'condition', label: 'Condition', type: 'text', required: true },
        { name: 'assigned_to', label: 'Assigned To', type: 'text', required: true }
      ]
    });
  }
});
</script>
